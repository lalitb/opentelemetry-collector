receivers:
  otlp:
    protocols:
      grpc:
      http:

exporters:
  azuregigwarm:
    endpoint: https://gcs.ppe.monitoring.core.windows.net
    environment: test
    account: PipelineAgent2Demo
    namespace: PAdemo2
    region: eastus
    config_major_version: 2
    auth_method: 1          # 0=msi, 1=certificate
    tenant: test-tenant
    role_name: test-role
    role_instance: test-role-instance
    # For certificate auth:
    # auth_method: 1
    cert_path: /tmp/client.p12
    cert_password: password

processors:
  batch:

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [azuregigwarm]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [azuregigwarm]
